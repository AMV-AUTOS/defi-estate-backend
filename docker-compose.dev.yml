services:
  postgres:
    image: postgres:16
    container_name: defi-estate-pg-dev
    environment:
      POSTGRES_USER: defi_estate
      POSTGRES_PASSWORD: defi_estate
      POSTGRES_DB: defi_estate
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: defi-estate-redis-dev
    ports:
      - '6379:6379'

volumes:
  postgres_data:
